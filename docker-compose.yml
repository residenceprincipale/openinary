services:
  # Named volumes are created root-owned; API and web run as uid 1000.
  db-init:
    profiles: ["api", "full"]
    image: alpine:3.20
    command:
      - sh
      - -c
      - chown -R 1000:1000 /app/data /app/apps/api/public /app/apps/api/cache && chmod 700 /app/data
    volumes:
      - db-data:/app/data
      - public-files:/app/apps/api/public
      - cache-data:/app/apps/api/cache
    networks:
      - openinary-network

  # API Only - Profile: api
  api:
    profiles: ["api"]
    # Use pre-built image by default, or build locally with: docker compose --profile api build
    image: openinary/openinary-api:${IMAGE_TAG:-latest}
    depends_on:
      db-init:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Mount cache folder for persistence
      - cache-data:/app/apps/api/cache
      # Mount public folder for static files
      - public-files:/app/apps/api/public
      # Mount data folder for shared auth database
      - db-data:/app/data
    # Only the variables listed under environment reach the container: add a
    # line here for any other one you set in .env. (No env_file: older Compose
    # can't parse its optional form and the short form fails without a .env.)
    environment:
      - NODE_ENV=production
      - MODE=api
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - API_SECRET=${API_SECRET:-}
      # IMAGE_TAG automatically mapped from IMAGE_TAG (single source of truth)
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      # Video queue configuration
      # VIDEO_MAX_CONCURRENT is auto-detected based on RAM (1 worker per 2GB)
      # Override only if you need custom concurrency settings
      - VIDEO_MAX_CONCURRENT=${VIDEO_MAX_CONCURRENT:-}
      - VIDEO_JOB_RETRY_MAX=${VIDEO_JOB_RETRY_MAX:-3}
      - VIDEO_JOB_CLEANUP_HOURS=${VIDEO_JOB_CLEANUP_HOURS:-24}
      - VIDEO_WORKER_POLL_INTERVAL_MS=${VIDEO_WORKER_POLL_INTERVAL_MS:-1000}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_UPLOAD_BODY_MB=${MAX_UPLOAD_BODY_MB:-256}
      - MAX_ZIP_MB=${MAX_ZIP_MB:-2048}
      - SHARP_CACHE_MB=${SHARP_CACHE_MB:-10}
      - SHARP_CONCURRENCY=${SHARP_CONCURRENCY:-1}
      - STORAGE_LIMIT_MB=${STORAGE_LIMIT_MB:-0}
      - DISABLE_TRANSFORMS=${DISABLE_TRANSFORMS:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - OPENINARY_TELEMETRY=${OPENINARY_TELEMETRY:-}
      - ALLOW_REMOTE_SOURCE=${ALLOW_REMOTE_SOURCE:-}
      - PUBLIC_RATE_LIMIT_MAX=${PUBLIC_RATE_LIMIT_MAX:-}
      - PUBLIC_RATE_LIMIT_WINDOW_MS=${PUBLIC_RATE_LIMIT_WINDOW_MS:-}
      # S3-compatible storage (local disk when STORAGE_BUCKET_NAME is empty)
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME:-}
      - STORAGE_REGION=${STORAGE_REGION:-}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      # No value on purpose: unset keeps the public/ default, while an empty
      # STORAGE_PREFIX= in .env means the bucket root.
      - STORAGE_PREFIX
      - STORAGE_MAX_SOCKETS=${STORAGE_MAX_SOCKETS:-}
      - STORAGE_CONNECTION_TIMEOUT=${STORAGE_CONNECTION_TIMEOUT:-}
      - STORAGE_REQUEST_TIMEOUT=${STORAGE_REQUEST_TIMEOUT:-}
      - STORAGE_SOCKET_TIMEOUT=${STORAGE_SOCKET_TIMEOUT:-}
      # Initial Authentication configuration
      - OPENINARY_ADMIN_NAME=${OPENINARY_ADMIN_NAME}
      - OPENINARY_ADMIN_EMAIL=${OPENINARY_ADMIN_EMAIL}
      - OPENINARY_ADMIN_PASSWORD=${OPENINARY_ADMIN_PASSWORD}
      - OPENINARY_GENERATE_API_KEY=${OPENINARY_GENERATE_API_KEY:-true}
    networks:
      - openinary-network
    # Resource limits to prevent video processing from crashing the server
    # Dynamic allocation: configure via env vars or use defaults for 4GB+ systems
    # For 16GB+ systems: DOCKER_MEMORY_LIMIT=12G DOCKER_CPU_LIMIT=4.0
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-2.0}'
          memory: ${DOCKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-0.5}'
          memory: ${DOCKER_MEMORY_RESERVATION:-1G}

  # Full stack split in three containers: API, web, nginx. No supervisord.
  api-full:
    profiles: ["full"]
    image: openinary/openinary-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    depends_on:
      db-init:
        condition: service_completed_successfully
    expose:
      - "3002"
    volumes:
      - cache-data:/app/apps/api/cache
      - public-files:/app/apps/api/public
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - MODE=fullstack
      - PORT=3002
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_INTERNAL_URL=http://web:3001
      - API_SECRET=${API_SECRET:-}
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - VIDEO_MAX_CONCURRENT=${VIDEO_MAX_CONCURRENT:-}
      - VIDEO_JOB_RETRY_MAX=${VIDEO_JOB_RETRY_MAX:-3}
      - VIDEO_JOB_CLEANUP_HOURS=${VIDEO_JOB_CLEANUP_HOURS:-24}
      - VIDEO_WORKER_POLL_INTERVAL_MS=${VIDEO_WORKER_POLL_INTERVAL_MS:-1000}
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      - MAX_UPLOAD_BODY_MB=${MAX_UPLOAD_BODY_MB:-256}
      - MAX_ZIP_MB=${MAX_ZIP_MB:-2048}
      - SHARP_CACHE_MB=${SHARP_CACHE_MB:-10}
      - SHARP_CONCURRENCY=${SHARP_CONCURRENCY:-1}
      - STORAGE_LIMIT_MB=${STORAGE_LIMIT_MB:-0}
      - DISABLE_TRANSFORMS=${DISABLE_TRANSFORMS:-false}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - OPENINARY_TELEMETRY=${OPENINARY_TELEMETRY:-}
      - ALLOW_REMOTE_SOURCE=${ALLOW_REMOTE_SOURCE:-}
      - PUBLIC_RATE_LIMIT_MAX=${PUBLIC_RATE_LIMIT_MAX:-}
      - PUBLIC_RATE_LIMIT_WINDOW_MS=${PUBLIC_RATE_LIMIT_WINDOW_MS:-}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME:-}
      - STORAGE_REGION=${STORAGE_REGION:-}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      - STORAGE_PREFIX
      - STORAGE_MAX_SOCKETS=${STORAGE_MAX_SOCKETS:-}
      - STORAGE_CONNECTION_TIMEOUT=${STORAGE_CONNECTION_TIMEOUT:-}
      - STORAGE_REQUEST_TIMEOUT=${STORAGE_REQUEST_TIMEOUT:-}
      - STORAGE_SOCKET_TIMEOUT=${STORAGE_SOCKET_TIMEOUT:-}
      - OPENINARY_ADMIN_NAME=${OPENINARY_ADMIN_NAME}
      - OPENINARY_ADMIN_EMAIL=${OPENINARY_ADMIN_EMAIL}
      - OPENINARY_ADMIN_PASSWORD=${OPENINARY_ADMIN_PASSWORD}
      - OPENINARY_GENERATE_API_KEY=${OPENINARY_GENERATE_API_KEY:-false}
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-2.0}'
          memory: ${DOCKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-0.5}'
          memory: ${DOCKER_MEMORY_RESERVATION:-1G}
    networks:
      - openinary-network

  web:
    profiles: ["full"]
    image: openinary/openinary-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        IMAGE_TAG: ${IMAGE_TAG:-latest}
    expose:
      - "3001"
    volumes:
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - DB_PATH=/app/data/auth.db
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-/api}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-http://localhost:3000}
      - BETTER_AUTH_INTERNAL_URL=http://web:3001
      - DISABLE_TRANSFORMS=${DISABLE_TRANSFORMS:-false}
    depends_on:
      api-full:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '${WEB_CPU_LIMIT:-1.0}'
          memory: ${WEB_MEMORY_LIMIT:-1G}
    networks:
      - openinary-network

  nginx:
    profiles: ["full"]
    image: nginx:1.27-alpine
    ports:
      - "3000:3000"
    volumes:
      - ./docker/nginx.split.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-full
      - web
    networks:
      - openinary-network

networks:
  openinary-network:
    driver: bridge

volumes:
  cache-data:
  public-files:
  db-data:
